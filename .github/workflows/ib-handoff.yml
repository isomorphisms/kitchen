name: IB source handoff regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Record exact source and run host fixtures
        run: |
          git rev-parse HEAD
          sh tests/ib-durable-store.sh
          sh tests/source-handoff.sh
