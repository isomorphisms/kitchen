name: Native Grease handoff checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: isomorphisms/ai-ci/transfer-handoff@0d1372e8f28773b24fd537dc738910ec92daa356
        with:
          catfood_ref: c16dcf0ab5057cbfd9cc7b0fedad587300724873
          kitchen_ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fp_ref: 146408ab64fe52c62edaa414126cae5ec952b3ca
          aici_ref: 0d1372e8f28773b24fd537dc738910ec92daa356
