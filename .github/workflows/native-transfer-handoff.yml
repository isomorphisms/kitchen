name: Native Grease handoff checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
  actions: read
jobs:
  acceptance:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    steps:
      - uses: isomorphisms/ai-ci/transfer-handoff@786937a9cd5499a21bef87f9358226b5e7a62ef8
        with:
          catfood_ref: f6a5700e9df33a8f1f31b6029bd691d2c7a6d11f
          kitchen_ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fp_ref: 146408ab64fe52c62edaa414126cae5ec952b3ca
          aici_ref: 786937a9cd5499a21bef87f9358226b5e7a62ef8
