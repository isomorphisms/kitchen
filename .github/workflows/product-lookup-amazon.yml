name: Amazon AZ wrapper contract
on:
  pull_request:

permissions:
  contents: read

jobs:
  wrapper:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - name: Shell syntax and independent location fixtures
        run: |
          dash -n tasks/product-lookup/amazon-az.sh tests/amazon-az-contract.sh
          sh tests/amazon-az-contract.sh
