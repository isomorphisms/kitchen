name: Kitchen Flower subpixel APK handoff fixtures
on:
  pull_request:
    paths:
      - 'tasks/flower-subpixel-apk/**'
      - 'tests/flower-subpixel-apk.sh'
      - 'tests/flower-subpixel-apk-v2.sh'
      - 'tests/flower-subpixel-apk-v3.sh'
      - '.github/workflows/flower-subpixel-apk.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  termux-handoff-fixtures:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Test POSIX script syntax
        run: |
          sh -n tasks/flower-subpixel-apk/1.sh
          sh -n tasks/flower-subpixel-apk/2.sh
          sh -n tasks/flower-subpixel-apk/3.sh
          sh -n tests/flower-subpixel-apk.sh
          sh -n tests/flower-subpixel-apk-v2.sh
          sh -n tests/flower-subpixel-apk-v3.sh
      - name: Exercise positive, ambiguous, wrong-device, wrong-hash, failed-intent mocks
        run: |
          sh tests/flower-subpixel-apk.sh
          sh tests/flower-subpixel-apk-v2.sh
          sh tests/flower-subpixel-apk-v3.sh
      - name: Record exact Kitchen script bytes for phone handoff
        run: sha256sum tasks/flower-subpixel-apk/1.sh tasks/flower-subpixel-apk/2.sh tasks/flower-subpixel-apk/3.sh
      - name: Assert production script pins only the two reviewed APK digests
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq 'a1_sha=7256bb53f40392ca35ef5ccf83cf040a633f70c6a97c27cdf303ea3969085a7d' tasks/flower-subpixel-apk/2.sh
          grep -Fxq 'c67_sha=14ac3dcc7547075b961436471b249a4354d7603f68c6404c5add2c0898a69bab' tasks/flower-subpixel-apk/2.sh
          ! grep -Eq '(^|[^a-z])(pm install|adb install|rish -c|curl .*-o)' tasks/flower-subpixel-apk/2.sh
