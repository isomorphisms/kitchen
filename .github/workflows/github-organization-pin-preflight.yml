name: GitHub organization pin preflight fixtures
on:
  push:
    paths:
      - 'tasks/github-organization-pin-preflight/**'
      - 'tests/github-organization-pin-preflight.py'
      - '.github/workflows/github-organization-pin-preflight.yml'
  pull_request:
    paths:
      - 'tasks/github-organization-pin-preflight/**'
      - 'tests/github-organization-pin-preflight.py'
      - '.github/workflows/github-organization-pin-preflight.yml'
permissions:
  contents: read
jobs:
  fixtures:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - run: python3 tests/github-organization-pin-preflight.py
