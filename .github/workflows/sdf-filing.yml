name: Exact mailbox handoff
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  handoff:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          path: kitchen
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: isomorphisms/mbox
          ref: 13584adf188b8a93f5328484f59a0c9230ea496f
          path: mbox
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.9'
      - name: Execute qualification suites before sealing the exact artifact
        run: python kitchen/tasks/sdf-spec-list-refile/gate.py qualify --engine "$GITHUB_WORKSPACE/mbox/examples/autogenerated/safe-filing" --receipt "$GITHUB_WORKSPACE/receipt.tsv" --source /var/mail/isomorphisms --destination /sdf/arpa/gm/i/isomorphisms/Mail/spec-list --mode inspect
