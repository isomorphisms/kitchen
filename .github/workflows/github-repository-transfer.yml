name: GitHub repository transfer regression
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Run generated transfer-script regression
        run: |
          git rev-parse HEAD
          sh tests/github-repository-transfer.sh
      - name: Run Grease transfer generation and identity regression (portable test dialect)
        run: sh tests/github-repository-transfer-grease.sh
